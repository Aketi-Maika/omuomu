[package]
name = "gallery-wasm"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gallery-core = { path = "../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
base64 = "0.22"
zip = { version = "2", default-features = false }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
